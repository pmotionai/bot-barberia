name: Keep Render service awake

on:
  schedule:
    # Cada 10 minutos. Render (plan gratuito) duerme el servicio tras ~15
    # min sin trafico, así que con este intervalo nunca deja pasar tanto.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -sf --max-time 60 https://bot-barberia-sz0k.onrender.com/ || true
